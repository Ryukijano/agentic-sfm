[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentic-sfm"
version = "0.1.0"
description = "Agentic SfM: RL-trained MLLM tool orchestration for hard 3D reconstruction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "vllm>=0.17",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "kornia>=0.7",
    "kornia-rs>=0.1",
    "pycolmap>=0.6",
    "pygltflib>=1.16",
    "tqdm>=4.66",
    "wandb>=0.18",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.7"]
rl = ["verl>=0.3", "ray>=2.30"]
match = ["mast3r @ git+https://github.com/naver/mast3r.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
