# Phase 2: Full agentic SfM with COLMAP + doppelganger tools
# Scene-level episodes with reconstruction-quality rewards

model:
  name: "Qwen/Qwen3.5-2B"
  max_new_tokens: 512
  # Scene SFT is the JSON contract for retrieve/sfm_run. After Phase-1 hard
  # lands, optionally point sft_adapter at outputs/phase1_hard/checkpoints/best_eval.
  checkpoint: "outputs/scene_sft/checkpoints/epoch_5"
  sft_adapter: "outputs/scene_sft/checkpoints/epoch_5"
  kl_adapter: "outputs/scene_sft/checkpoints/epoch_5"
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "in_proj_qkv", "in_proj_z", "in_proj_b", "in_proj_a", "out_proj", "gate_proj", "up_proj", "down_proj"]

rl:
  algorithm: "grpo"
  framework: "custom"
  group_size: 6           # N trajectories per scene
  max_tool_calls: 20      # more tools per episode than Phase 1
  max_turns: 30           # more turns for multi-step pipeline
  temperature: 1.0
  top_p: 0.95
  # DAPO-style improvements
  clip_low: 0.2
  clip_high: 0.28
  dynamic_sampling: true
  # S-GRPO CGI: inject oracle trajectory when all rollouts fail
  sgrpo_cgi: true
  # Dynamic reward scaling
  reward_schedule: "dynamic"
  reward_warmup_steps: 20

tools:
  enabled: ["crop", "match", "doppelganger_check", "retrieve", "sfm_run", "inspect"]
  matchers: ["loftr"]      # start with LoFTR, add mast3r later
  sfm_backend: "colmap"

reward:
  # Scene-level rewards
  registration_weight: 0.5   # fraction of images registered
  pose_weight: 1.0           # mean pose error (1 - err/20)
  split_penalty: 0.5         # penalty when 0 images registered
  doppelganger_weight: 0.0   # DISABLED: self-certified bonus (+0.3 for flagging
                           # any pair, no GT labels) was reward-hackable; recon
                           # quality already rewards correct exclusions
  # Accumulative tool reward (replaces per-call penalty)
  tool_cost: 0.0             # legacy (disabled)
  accumulative_tool_coef: 0.1
  use_accumulative_tool_reward: true
  format_weight: 0.1
  invalid_penalty: 0.2
  # Same first-call gate as Phase 1: a rejected first retrieve/crop zeros
  # registration/pose so degenerate calls cannot win the group.
  first_call_validity_weight: 0.5
  first_call_invalid_penalty: 1.0
  gate_geometry_on_validity: true
  # NTEP off: many legitimate scene matches revisit the same pair.
  use_ntep_rewards: false
  ntep_intent_coef: 0.05
  ntep_redundancy_penalty: 0.05

curriculum:
  enabled: true
  stages:
    - {epochs: 10, max_images: 10, scenes: ["0015"]}           # small scene warmup
    - {epochs: 20, max_images: 20, scenes: ["0015", "0022"]}   # add second scene
    - {epochs: 20, max_images: 50, scenes: null}               # all scenes

training:
  lr: 5.0e-6
  weight_decay: 0.01
  warmup_steps: 200
  total_epochs: 50
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  save_freq: 5
  eval_freq: 5
  log_freq: 10
  # Phase-1 collapse fixes — SceneGRPOTrainer inherits these from GRPOTrainer.
  kl_coef: 0.03
  off_support_threshold: -9.0
  on_policy_reload: true
  lora_staging_dir: "/dev/shm"

rollout:
  vllm_gpu: 0
  training_gpu: 1
  matcher_gpu: 2            # also runs COLMAP (pycolmap)
  vllm_port: 8000
  tool_server_port: 8765
  num_rollout_workers: 4
  batch_size: 2             # scenes per batch (fewer than pairs — more expensive)
  min_p: 0.05
  top_k: 50

data:
  # Scene data from MegaDepth scene_info
  scene_info_dir: "/scratch/kcwp264/data/megadepth/scene_info_full/scene_info"
  image_root: "/scratch/kcwp264/data/megadepth/megadepth_test_1500"
  # Indoor RGB-D scenes: extracted scannet_test_1500 scenes (sceneNNNN_MM
  # dirs).  When set, ScanNet scenes are concatenated with MegaDepth for
  # Phase 2 scene training.  Set to null to disable.
  scannet_root: "/scratch/kcwp264/data/megadepth/scannet_test_1500/scannet_test_1500"
  scannet_scene_ids: null    # e.g. ["scene0772_00"]; null = all extracted
  max_images_per_scene: 20   # images per scene episode (curriculum increases this)
  min_images_per_scene: 5
  matcher: "loftr"
  # Phase 2 datasets (for doppelganger training)
  doppelganger_dataset: "data/doppelgangers"

output:
  checkpoint_dir: "outputs/phase2/checkpoints"
  results_dir: "outputs/phase2"
  log_dir: "logs/phase2"
  wandb_project: "agentic-sfm"
  wandb_entity: null
  wandb_run_name: "phase2-scene-grpo-qwen35-2b-r3"  # r3: KL + on-policy + first-call gate
