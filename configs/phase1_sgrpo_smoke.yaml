# S-GRPO smoke test config: verifies the full S-GRPO training loop end-to-end
# on a tiny slice of the training set before launching the real phase1_grpo run.
#
# Based on configs/phase1_grpo.yaml with:
#   - data subset: first 50 pairs of hard_pairs_train.json
#     (data/hard_pairs_train_smoke50.json, generated by jobs/phase1_sgrpo_smoke.slurm)
#   - 2 epochs, group_size=4
#   - S-GRPO CGI enabled (oracle trajectory injection on all-fail groups)
#   - PyVision-RL accumulative tool reward (tool_cost disabled)
#
# NOTE: the first 50 train pairs are ALL difficulty="medium" — the curriculum
# stage below must include "medium" or no pairs will be selected.

model:
  name: "Qwen/Qwen3-VL-2B-Instruct"
  max_new_tokens: 512
  sft_adapter: "outputs/sft/checkpoints/epoch_5"  # optional warmup; skipped if dir absent
  lora:
    rank: 32                  # must be <= vLLM --max-lora-rank 32
    alpha: 64
    dropout: 0.0  # GRPO: dropout would make eval/train logprob ratio noise
    # Qwen3-VL: standard attention + MLP (no Gated DeltaNet)
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

rl:
  algorithm: "grpo"
  framework: "verl"
  group_size: 4           # N trajectories per prompt for GRPO (smoke: 4 instead of 8)
  max_tool_calls: 6       # trimmed for smoke (base: 10) — still exercises multi-turn tool use
  max_turns: 10           # trimmed for smoke (base: 15)
  temperature: 1.0        # sampling temperature for exploration
  top_p: 0.95
  # DAPO-style improvements
  clip_low: 0.2           # lower clip range (standard PPO)
  clip_high: 0.28         # upper clip range (Clip-Higher prevents entropy collapse)
  dynamic_sampling: true  # skip groups where all rollouts get same reward (zero gradient)
  # Dynamic reward scaling: format-heavy early, correctness-heavy later (ToolRL)
  reward_schedule: "dynamic"  # "static" or "dynamic"
  reward_warmup_steps: 5     # smoke: short warmup so both schedule phases are exercised
  # S-GRPO: Conditional Ground-Truth Trajectory Injection (arXiv 2604.16557)
  # When all rollouts in a group fail, inject the oracle trajectory with max reward.
  # Replaces the separate oracle-SFT stage — solves cold-start inside the RL loop.
  sgrpo_cgi: true

reward:
  pose_weight: 1.0        # final outcome (must dominate per Fireworks/ToolRL)
  inlier_weight: 0.1      # dense shaping from match quality
  # PyVision-RL accumulative tool reward (ICML 2026):
  # R_tool = coef * n_valid_calls * 1[outcome_correct]
  # Replaces the old per-call tool_cost penalty which caused interaction collapse.
  tool_cost: 0.0          # legacy per-call penalty (disabled — set to 0)
  accumulative_tool_coef: 0.1  # reward productive tool calls only when pose is correct
  use_accumulative_tool_reward: true
  format_weight: 0.1      # format compliance (valid JSON tool calls)
  invalid_penalty: 0.2    # per-invalid-call penalty
  pose_auc_thresholds: [5, 10, 20]  # degrees

curriculum:
  enabled: true
  schedule: "overlap_bins"
  # Smoke: single stage covering all 2 epochs. The 50-pair subset is all
  # "medium", but list every difficulty so the config stays valid if the
  # subset file is regenerated differently.
  stages:
    - {epochs: 2, difficulties: ["medium", "hard", "extreme", "easy"]}

training:
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 5          # smoke: short warmup (base: 100)
  total_epochs: 2          # smoke: 2 epochs only
  gradient_accumulation_steps: 1  # smoke: 1 → more optimizer steps = better loop coverage
  max_grad_norm: 1.0
  save_freq: 1            # smoke: save every epoch to exercise checkpoint + vLLM LoRA reload
  eval_freq: 2            # smoke: eval once (end of epoch 2)
  log_freq: 1             # smoke: log every step

rollout:
  # GPU allocation on 3x L40S
  vllm_gpu: 0            # GPU 0: vLLM rollout server
  training_gpu: 1        # GPU 1: training (FSDP/LoRA)
  matcher_gpu: 2         # GPU 2: matcher inference server
  vllm_port: 8000
  tool_server_port: 8765
  num_rollout_workers: 2  # CPU workers for tool execution (smoke: 2 instead of 4)
  batch_size: 4           # pairs per batch

data:
  # First 50 pairs of data/hard_pairs_train.json — generated by
  # jobs/phase1_sgrpo_smoke.slurm before training starts.
  train_pairs: "data/hard_pairs_train_smoke50.json"
  val_pairs: "data/hard_pairs_val.json"
  matcher: "loftr"       # start with LoFTR, switch to mast3r later

output:
  checkpoint_dir: "outputs/sgrpo_smoke/checkpoints"
  results_dir: "outputs/sgrpo_smoke"
  log_dir: "logs/sgrpo_smoke"
  wandb_project: "agentic-sfm"
  wandb_entity: null
  wandb_run_name: "phase1-sgrpo-smoke-qwen3vl-2b"
  wandb_enabled: false   # smoke test: no W&B run
