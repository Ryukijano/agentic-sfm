# Phase 1: GRPO RL training for agentic matching
# Qwen3.5-2B + LoRA, vllm rollout, verifiable pose rewards

model:
  name: "Qwen/Qwen3.5-2B"
  max_new_tokens: 512
  # Warm start = SFT epoch_5, the ONLY adapter proven to generate clean tool
  # JSON (verified offline: 6/6 clean; the trained phase1 "best" is 6/6
  # degenerate). The trained adapter was RL-degenerate all along — see
  # experiments/sft-warmstart-ablation/protocol.md and the KL/on-policy fixes.
  sft_adapter: "outputs/sft/checkpoints/epoch_5"
  lora:
    rank: 32
    alpha: 64
    dropout: 0.0  # GRPO: dropout would make eval/train logprob ratio noise
    # Qwen3.5: gated attention + Gated DeltaNet + MLP
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "in_proj_qkv", "in_proj_z", "in_proj_b", "in_proj_a", "out_proj", "gate_proj", "up_proj", "down_proj"]

rl:
  algorithm: "grpo"
  framework: "verl"
  group_size: 8           # N trajectories per prompt for GRPO
  max_tool_calls: 10
  max_turns: 15           # max conversation turns per rollout
  temperature: 1.0        # sampling temperature for exploration
  top_p: 0.95
  # DAPO-style improvements
  clip_low: 0.2           # lower clip range (standard PPO)
  clip_high: 0.28         # upper clip range (Clip-Higher prevents entropy collapse)
  dynamic_sampling: true  # skip groups where all rollouts get same reward (zero gradient)
  # Dynamic reward scaling: format-heavy early, correctness-heavy later (ToolRL)
  reward_schedule: "dynamic"  # "static" or "dynamic"
  reward_warmup_steps: 30    # steps before shifting to correctness-focused
  # S-GRPO: Conditional Ground-Truth Trajectory Injection (arXiv 2604.16557)
  # When all rollouts in a group fail, inject the oracle trajectory with max reward.
  # Replaces the separate oracle-SFT stage — solves cold-start inside the RL loop.
  sgrpo_cgi: true

reward:
  pose_weight: 1.0        # final outcome (must dominate per Fireworks/ToolRL)
  inlier_weight: 0.1      # dense shaping from match quality
  # PyVision-RL accumulative tool reward (ICML 2026):
  # R_tool = coef * n_valid_calls * 1[outcome_correct]
  # Replaces the old per-call tool_cost penalty which caused interaction collapse.
  tool_cost: 0.0          # legacy per-call penalty (disabled — set to 0)
  accumulative_tool_coef: 0.1  # reward productive tool calls only when pose is correct
  use_accumulative_tool_reward: true
  format_weight: 0.1      # BINARY: 1.0 only if every call accepted, else 0
  invalid_penalty: 0.2    # per-invalid-call penalty
  # First-call validity gate: the policy's most controllable decision.
  # A rejected/degenerate FIRST call is catastrophically expensive and gates
  # off all geometry reward — kills the "least-bad-wins" degenerate trap.
  first_call_validity_weight: 0.5
  first_call_invalid_penalty: 1.0
  gate_geometry_on_validity: true
  pose_auc_thresholds: [5, 10, 20]  # degrees
  # NTEP process rewards (arXiv 2609.03493): per-call intent alignment +
  # non-repeated-goal penalty. On now — penalizes the "slightly different
  # tiny box" alternation that the identical-call breaker cannot catch.
  use_ntep_rewards: true
  ntep_intent_coef: 0.05
  ntep_redundancy_penalty: 0.05

curriculum:
  enabled: true
  schedule: "overlap_bins"
  # Data distribution (1500 pairs): medium=898, hard=600, extreme=2
  # Phase 1a: medium only (warm-up, LoFTR works decently) → Phase 1b: add hard → Phase 1c: add all
  stages:
    - {epochs: 10, difficulties: ["medium"]}
    - {epochs: 20, difficulties: ["medium", "hard"]}
    - {epochs: 20, difficulties: ["medium", "hard", "extreme", "easy"]}

training:
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  total_epochs: 50
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  save_freq: 5           # save checkpoint every N epochs
  eval_freq: 5
  log_freq: 10
  eval_max_pairs: null   # full shuffled val; first-50 was all-hard
  # KL(pi || pi_SFT) per-token penalty (k3 estimator). Anchors the policy to
  # the SFT distribution that writes clean tool JSON; the trained policy
  # previously drifted degenerate because nothing held it near SFT.
  kl_coef: 0.03
  # mu-GRPO off-support veto: for negative advantages, skip tokens whose
  # old-policy logp is below this (they are already implausible — suppressing
  # them further is what shoves the policy into narrow degenerate modes).
  off_support_threshold: -9.0
  # On-policy rollouts: hot-reload the LoRA into vLLM after every global step
  # (staged on /dev/shm) so the measured policy IS the trained policy.
  on_policy_reload: true
  lora_staging_dir: "/dev/shm"

rollout:
  # GPU allocation on 3x L40S
  vllm_gpu: 0            # GPU 0: vLLM rollout server
  training_gpu: 1        # GPU 1: training (FSDP/LoRA)
  matcher_gpu: 2         # GPU 2: matcher inference server
  vllm_port: 8000
  tool_server_port: 8765
  num_rollout_workers: 4  # CPU workers for tool execution
  batch_size: 4           # pairs per batch
  # Sampling hardening: cut the long token tail that seeds repetition loops
  # in a 2B model (the "0.1, 0.2, 0.1, 0.8" fragments came from tail tokens).
  min_p: 0.05
  top_k: 50

data:
  train_pairs: "data/hard_pairs_train.json"
  val_pairs: "data/hard_pairs_val.json"
  matcher: "loftr"       # start with LoFTR, switch to mast3r later

output:
  checkpoint_dir: "outputs/phase1/checkpoints"
  results_dir: "outputs/phase1"
  log_dir: "logs/phase1"
  wandb_project: "agentic-sfm"
  wandb_entity: null
  wandb_run_name: "phase1-grpo-qwen35-2b-r3"  # r3: on-policy reload + KL anchor + validity gate
